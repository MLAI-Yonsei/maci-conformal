[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maci-conformal"
dynamic = ["version"]
description = "Multi-LLM Adaptive Conformal Inference (MACI): conformal claim filtering for LLM factuality"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "MLAI-Yonsei" }]
requires-python = ">=3.9"
keywords = ["conformal prediction", "factuality", "LLM", "hallucination", "uncertainty quantification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "pandas>=1.4",
    "cvxpy>=1.3",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
# Conditional Conformal Inference baseline (pulls in PyTorch).
cci = ["torch>=1.13", "conditionalconformal>=0.0.5"]
dev = ["pytest>=7", "build>=1.0", "twine>=4"]

[project.scripts]
maci = "maci_conformal.cli:main"

[project.urls]
Homepage = "https://github.com/MLAI-Yonsei/MACI"
Source = "https://github.com/MLAI-Yonsei/MACI"
Issues = "https://github.com/MLAI-Yonsei/MACI/issues"

[tool.setuptools.dynamic]
version = { attr = "maci_conformal.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maci_conformal = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
