name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }}${{ matrix.extras == 'cci,dev' && ' + CCI' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        extras: ["dev"]
        include:
          - python-version: "3.12"
            extras: "cci,dev"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        # CPU-only PyTorch keeps the CCI job small.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[${{ matrix.extras }}]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          maci --version
          maci info
          maci config init /tmp/maci.toml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
